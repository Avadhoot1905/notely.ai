[package]
name = "notely-engine"
description = "Notely local engine: media, ASR, AI, LLM runtime, storage and rendering behind an IPC boundary."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The engine is a library (so modules are unit/integration testable) plus a thin binary.
[lib]
name = "notely_engine"
path = "src/lib.rs"

[[bin]]
name = "notely-engine"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
uuid.workspace = true
chrono.workspace = true

[dev-dependencies]
# Integration tests (engine/tests/) need the async runtime macros, trait macros and JSON.
tokio = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
