# Manifest for the OPTIONAL Whisper ASR backend.
#
# METADATA ONLY — no weights in the repo. The ASR provider downloads the model into its own cache.
# See models/README.md.
#
# NOTE: Whisper is NOT the v0 default ASR — Qwen3-ASR is (see qwen3-asr.yaml). Whisper is kept as an
# optional/future provider behind the same AsrProvider trait.
name: whisper
task: speech-recognition
status: optional          # default ASR is Qwen3-ASR
provider: whisper         # concrete ASR backend (see engine/src/asr/whisper.rs)
model_ref: large-v3       # which Whisper checkpoint to use
languages: multilingual   # Notely targets multilingual / code-switched meetings
quantization: null
notes: >
  Optional fallback ASR. The pipeline depends on the AsrProvider trait, not on Whisper directly.
